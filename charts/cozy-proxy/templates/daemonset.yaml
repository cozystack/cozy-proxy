apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cozy-proxy.fullname" . }}
  labels:
    {{- include "cozy-proxy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "cozy-proxy.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "cozy-proxy.name" . }}
      annotations:
        {{- toYaml .Values.daemonset.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cozy-proxy.fullname" . }}
      hostNetwork: {{ .Values.daemonset.hostNetwork }}
      containers:
        - name: cozy-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $keepL4Table := and (not .Values.l4LoadBalancer.enabled) (not .Values.l4LoadBalancer.removeTableWhenDisabled) }}
          {{- if or .Values.l4LoadBalancer.enabled (not .Values.vmMode.enabled) $keepL4Table }}
          args:
            {{- if .Values.l4LoadBalancer.enabled }}
            - --enable-l4-loadbalancer
            {{- end }}
            {{- if $keepL4Table }}
            - --remove-l4-table-when-disabled=false
            {{- end }}
            {{- if not .Values.vmMode.enabled }}
            - --enable-vm-mode=false
            {{- end }}
          {{- end }}
          env:
            # Scopes the ingress rules to the backends hosted on this node; see
            # "Rule scoping" in the README for why a non-hosting node must not
            # program them.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
      tolerations:
      - operator: Exists
