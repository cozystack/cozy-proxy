image:
  repository: ghcr.io/cozystack/cozystack/cozy-proxy
  tag: v0.4.0
  pullPolicy: IfNotPresent

daemonset:
  hostNetwork: true
  podAnnotations: {}
  podLabels: {}

rbac:
  create: true

# L4 LoadBalancer mode: takes over from Cilium the public IP of services
# labelled networking.cozystack.io/lb-proxy=cozy-proxy that also carry
# service.cilium.io/type=ClusterIP. See docs/rfc/l4-loadbalancer-mode.md.
# Disabling it removes the table it programmed on the next start.
l4LoadBalancer:
  enabled: false

# VM mode, for services labelled service.kubernetes.io/service-proxy-name=cozy-proxy.
# Turn it off only to run the L4 mode as a second release next to a cozy-proxy
# that keeps the VM mode, for instance to try the L4 mode on a live cluster.
vmMode:
  enabled: true
